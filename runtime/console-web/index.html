<!doctype html>
<!-- [AI-added] 2026-09-19 00:25 -->
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task Dispatch · 统一控制台</title><link rel="stylesheet" href="/catalog/style.css"><script type="module" src="/catalog/app.js"></script></head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="brand-mark">T</span><span class="brand-text">Task Dispatch<small>统一控制台</small></span></a>
    <div class="header-actions">
      <!-- [AI-added] 2026-09-21 10:20: Console service version badge, filled by /catalog/api/version. -->
      <span id="build-version" class="pill muted" hidden></span>
      <span id="live" class="pill muted" hidden>未连接</span>
      <button id="theme-toggle" type="button" aria-label="切换夜间模式">夜间</button>
      <button id="refresh" type="button">刷新</button>
      <button id="export" type="button" hidden>导出诊断</button>
      <button id="controls" type="button" class="primary" hidden>后台控制</button>
    </div>
  </header>
  <div class="page"><div id="banner" class="banner" hidden></div><main id="view" class="view"></main>
  <footer class="footer"><span>监控仅展示服务观察到的事实，不推测模型内部活动。</span><span id="revision"></span></footer></div>
  <dialog id="command-dialog"><form id="command-form"><div class="dialog-heading"><h2>后台控制</h2><button type="button" id="close-dialog" aria-label="关闭">✕</button></div><label>操作<select id="action"><option value="pause">暂停项目</option><option value="resume">继续项目</option><option value="retry">重试阻塞任务</option><option value="task-budget">追加尝试额度</option><option value="assign">改派执行员</option><option value="rebind-invite">生成改绑提示词</option><option value="rebind-cancel">取消改绑邀请</option><option value="detach">解绑选中端</option><option value="wake-retry">检查并重试 pending 唤醒</option><option value="wake-remind">再次提醒未领取端</option><option value="finish-project">结束项目</option><option value="reopen-project">重新开启项目</option><option value="archive-project">归档项目</option><option value="restore-project">恢复归档项目</option><option value="delete-project">永久删除项目</option><option value="reset-task">完全重置任务</option><option value="cleanup-preview">存储清理预览</option><option value="cleanup-apply">按预览清理</option><option value="stop">停止服务</option></select></label><label id="command-project-label">项目<select id="command-project"></select></label><label>任务<select id="command-task"></select></label><label>连接<select id="command-binding"></select></label><label>改绑邀请 ID<input id="invitation-id" placeholder="取消邀请时填写"></label><label>目标执行员编号（改派）<input id="worker-id" placeholder="例如 mimo-worker"></label><label>追加次数<input id="additional" type="number" min="1" max="100" value="2"></label><label>操作原因<input id="reason" maxlength="500" placeholder="请简述原因，供后续排查"></label><label class="check"><input id="confirmed-stopped" type="checkbox"> 已核实旧会话及后台任务停止（勾选后改绑会转移在途所有权）</label><label class="check"><input id="restart-worker" type="checkbox"> 重试时重新交给执行员修改</label><label id="confirm-text-label">确认目标 ID（删除填项目 ID，重置填任务 ID）<input id="confirm-text"></label><label class="check" id="reset-dependents-label"><input id="reset-dependents" type="checkbox"> 同时重置全部下游任务</label><p id="impact" class="impact"></p><button type="button" id="lifecycle-preview">预览影响范围</button><label class="check"><input id="confirm-impact" type="checkbox"> 我已核对目标和操作影响</label><pre id="command-result" aria-live="polite"></pre><div class="dialog-actions"><button type="submit" class="primary" id="execute">执行操作</button></div></form></dialog>
  <dialog id="cleanup-dialog"><form id="cleanup-form"><div class="dialog-heading"><h2>清理无效项目</h2><button type="button" id="close-cleanup" aria-label="关闭">✕</button></div><p class="cleanup-note">以下项目的工作目录已不存在。清理只从目录索引移除登记记录，不删除项目数据；下次在项目中运行 start.bat 会自动重新登记。</p><ul id="cleanup-list"></ul><pre id="cleanup-result" hidden></pre><div class="dialog-actions"><button type="button" id="cleanup-cancel">取消</button><button type="submit" class="primary" id="cleanup-confirm">确认清理</button></div></form></dialog>
  <dialog id="invitation-dialog"><div class="dialog-heading"><h2>改绑提示词已生成</h2><button type="button" id="close-invitation" aria-label="关闭">✕</button></div><p class="cleanup-note" id="invitation-meta"></p><label>接收端平台（按目标会话的实际平台选择）<select id="invitation-platform"></select></label><p class="impact" id="invitation-hint"></p><textarea id="invitation-text" readonly rows="12" spellcheck="false"></textarea><div class="dialog-actions"><button type="button" id="copy-invitation">复制提示词</button><button type="button" class="primary" id="invitation-done">关闭</button></div></dialog>
</body></html>
